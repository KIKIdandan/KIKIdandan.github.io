  enable: false
  minCharNumber: 120
  description: 本文章著作权归作者所有，任何形式的转载都请注明出处。

# 数学公式
mathjax:
  enable: false

# 文章信息
postInfo:
  date: true
  update: false
  wordCount: false
  totalCount: false
  min2read: false
  readCount: false

# 点击爱心 / 樱花 / 星星 / 飘雪（全部关闭，保持科研风格）
clicklove:
  enable: false
sakura:
  enable: false
mouseStar:
  enable: false
snowdown:
  enable: false

# ---------- 关于页个人信息 ----------
profile:
  avatar: /medias/dog/avatar.svg
  career: 东北林业大学 · 控制科学与工程 · 硕士研究生（研二）
  introduction: 东北林业大学控制科学与工程专业硕士研究生，目前研二。本科就读于东北林业大学自动化专业。熟练使用 Python、MATLAB 进行工程编程与仿真开发，掌握系统建模、数据分析与程序调试优化等专业技能。

# ---------- 关于页：我的项目 ----------
myProjects:
  enable: true
  data:
    落叶松枯梢病菌时空蔓延机制研究:
      featured: true
      icon: fas fa-tree
      iconBackground: 'linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%)'
      url: /research/larch-swoosh-disease/
      demoUrl:
      githubUrl:
      desc: 国家重点研发计划子课题（2024.12—2025.12）。参与搭建病害三大数据库、深度学习时空蔓延模型研建与调试优化，协助撰写项目报告、梳理论文内容。
      shortDesc: 参与国家重点研发计划子课题，负责病害数据库搭建与时空蔓延模型研建。
      label: '国家重点研发计划子课题'
      highlight: '数据处理 · 模型研建'
      tech:
        - 数据库搭建
        - 数据清洗
        - 深度学习模型
        - Python
    ABM-SI 模型松材线虫病传播预测研究:
      featured: true
      icon: fas fa-bug
      iconBackground: 'linear-gradient(135deg, #2563eb 0%, #3b82f6 100%)'
      url: /research/abm-si/
      demoUrl:
      githubUrl:
      desc: 基于智能体建模（ABM）与 SI 流行病传播模型，结合 GIS 空间数据构建松材线虫病传播预测模型。
      shortDesc: ABM-SI 模型构建与松材线虫病传播仿真。
      label: '当前研究方向'
      highlight: '智能体建模 · 传播预测'
      tech:
        - ABM
        - SI 模型
        - MATLAB
        - 仿真
    遥感影像与 GIS 空间数据分析:
      featured: true
      icon: fas fa-satellite
      iconBackground: 'linear-gradient(135deg, #315c79 0%, #3b82f6 100%)'
      url: /research/remote-sensing-gis/
      demoUrl:
      githubUrl:
      desc: 利用遥感影像获取森林资源数据，结合 GIS 空间分析技术处理地理信息，为病害监测和防控提供空间数据支撑。
      shortDesc: 遥感影像处理与 GIS 空间分析。
      label: '研究方向'
      highlight: '遥感 · GIS 空间分析'
      tech:
        - 遥感影像
        - GIS
        - 空间分析
        - Python

# ---------- 关于页：我的技能 ----------
# 统一使用 90% 表示"已掌握"，不做熟练度差异评估
mySkills:
  enable: true
  data:
