  github:
  email:
  facebook:
  twitter:
  qq:
  weibo:
  zhihu:
  rss: false

# ---------- 文章目录 ----------
toc:
  enable: true
  heading: h2, h3, h4
  collapseDepth: 0
  showToggleBtn: true

# 代码块
code:
  lang: true
  copy: true
  shrink: true
  break: false

# 打赏（关闭）
