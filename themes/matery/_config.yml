      background: 'linear-gradient(to right, #1e3a5f 0%, #315c79 100%)'
      percent: 90%
    MATLAB / Simulink:
      background: 'linear-gradient(to right, #2563eb 0%, #3b82f6 100%)'
      percent: 90%
    系统建模:
      background: 'linear-gradient(to right, #315c79 0%, #60a5fa 100%)'
      percent: 90%
    数据分析:
      background: 'linear-gradient(to right, #1e3a5f 0%, #3b82f6 100%)'
      percent: 90%
    算法实现:
      background: 'linear-gradient(to right, #2563eb 0%, #60a5fa 100%)'
      percent: 90%

