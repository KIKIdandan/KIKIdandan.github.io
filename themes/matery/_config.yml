# ---------- 导航菜单 ----------
menu:
  首页:
    url: /
    icon: fas fa-home
  科研项目:
    url: /research
    icon: fas fa-flask
  工程项目:
    url: /projects
    icon: fas fa-microchip
  技术博客:
    url: /#articles
    icon: fas fa-book-open
  个人简历:
    url: /resume
    icon: fas fa-id-card
  关于我:
    url: /about
    icon: fas fa-user-circle

# 站点起始时间
time:
  enable: true
  year: 2026
  month: 01
  date: 01
  hour: 00
  minute: 00
  second: 00

# ---------- 首页封面轮播 ----------
cover:
  showPrevNext: false
  showIndicators: false
  autoLoop: false
  duration: 120
  intervalTime: 5000
  useConfig: false
  video:
    enable: false

# 梦想语句（关闭，保持专业）
dream:
  enable: false

# 音乐（关闭）
music:
  enable: false

# 视频（关闭）
video:
  enable: false

# 推荐文章
recommend:
  enable: true
  showTitle: true
  useConfig: false

# ---------- 站点标识 ----------
favicon: /favicon.png
logo: /medias/dog/logo.svg

# 首页 Banner 第二个按钮（暂未提供 GitHub，关闭）
indexbtn:
  enable: false
  name: GitHub
  icon: fab fa-github-alt
  url:

# 社交链接（未提供账号，留空不显示）
